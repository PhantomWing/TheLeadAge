modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "https://github.com/PhantomWing/TheLeadAge/issues"
license = "MIT License"

[[mods]]
modId = "theleadage"
version = "${version}"
displayName = "The Lead Age"
displayURL = "https://github.com/PhantomWing/TheLeadAge"
logoFile = "icon.png"
authors = "PhantomWing"
description = '''
A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
'''

# AFTER, so the mod's data, its overrides of vanilla recipes among it, outranks Forge's own.
[[dependencies.theleadage]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.theleadage]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.theleadage]]
modId = "architectury"
mandatory = true
versionRange = "[9.2.14,10)"
ordering = "AFTER"
side = "BOTH"

# ---- Optional integrations. All are `mandatory = false`, so the mod loads happily without any of
# them; `ordering = "AFTER"` only asks the loader to place them before us when they ARE present.
# Farmer's Delight matters most here: LeadKnifeItem extends its KnifeItem, so FD must be loaded
# before our items are constructed. (Dev-only runtime mods such as AppleSkin are NOT listed.)
#
# versionRange is deliberately "[0,)" (any version) on all of them. These mods declare a plain
# semver internally that does NOT match their download filename — Farmer's Delight ships as
# "farmers-delight-1.21.1-1.3.1.jar" but declares version "1.3.1" — so a range written from the
# filename rejects the very build it was meant to allow, and FML then refuses to load at all. An
# optional dep gains nothing from a lower bound anyway: these are advertising + load-order hints.

[[dependencies.theleadage]]
modId = "create"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.theleadage]]
modId = "farmersdelight"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

# Optional: after Vanilla Backport, so the Lead Spear goes in the Combat tab after its Golden Spear, which it adds in
# the same creative tab event (VanillaTabs).
[[dependencies.theleadage]]
modId = "vanillabackport"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.theleadage]]
modId = "mekanism"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.theleadage]]
modId = "jei"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.theleadage]]
modId = "emi"
mandatory = false
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

# A lit campfire over raw lead gives off lead fumes from its block entity's tick, which Lithium stops once nothing
# cooks on it.
["lithium:options"]
"mixin.world.block_entity_ticking.sleeping.campfire" = false
