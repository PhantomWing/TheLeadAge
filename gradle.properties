## Mod info
mod_version=1.1.1
mod_id=theleadage
mod_group_id=com.phantomwing.theleadage
mod_license=MIT License
mod_name=The Lead Age
mod_description=A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21. The system
# default `java` may be an older JDK, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not yet compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.4
parchment_mappings_version=2025.03.23

# Minecraft 1.21.4
minecraft_version=1.21.4
minecraft_version_range=[1.21.4,1.21.5)
# Game versions tagged on the Modrinth/CurseForge uploads (space or comma separated). Kept separate
# from the build target so a release can advertise every version it actually runs on.
supported_minecraft_versions=1.21.4
neo_version=21.4.157
neo_version_range=[21.4,)
loader_version_range=[4,)

# Architectury / multi-loader. 1.21.4 needs loom 1.10 (1.7 cannot remap it); Gradle wrapper
# moves to 8.12 with it. Versions match TheSilverAge branch version/1.21.4.
architectury_plugin_version=3.4.164
architectury_loom_version=1.10.455
architectury_version=15.0.3
enabled_platforms=fabric,neoforge

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.119.4+1.21.4

# Cloth Config (Fabric only, REAL dep) — backs the Fabric AutoConfig config screen.
cloth_config_version=17.0.144

# Other dev-runtime dependencies (never shipped). The mc1.21.3 AppleSkin builds are
# author-tagged compatible with 1.21.4 on Modrinth.
appleskin_neoforge_version=mc1.21.3-3.0.8
appleskin_fabric_version=mc1.21.3-3.0.6

# --- 1.21.4 PORT NOTES ----------------------------------------------------------
# Availability re-verified against the Modrinth API for 1.21.4:
#   * Create, Farmer's Delight (both loaders) and EMI: still NO build — their compat
#     stays dropped, as on the 1.21.3 branch. The Lead Knife keeps its SwordItem
#     fallback via the compile-only KnifeItem stub.
#   * JEI: HAS a NeoForge 1.21.4 build (20.0.0.x) — the plugin could be restored on
#     this branch (port from version/1.21 to the JEI 20 API; not done yet).
# --------------------------------------------------------------------------------

# Publishing — Modrinth / CurseForge project IDs (PUBLIC identifiers, not secrets).
# Tokens come from the account-wide MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars in CI, falling back
# to modrinth_token / curseforge_token in the global ~/.gradle/gradle.properties for local runs.
mod_publish_plugin_version=2.0.0
modrinth_project_id=zv6Yo2mC
curseforge_project_id=1544260
