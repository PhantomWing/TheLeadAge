## Mod info
mod_version=1.3.1
mod_id=theleadage
mod_group_id=com.phantomwing.theleadage
mod_license=MIT License
mod_name=The Lead Age
mod_description=A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21, though this line
# compiles for Java 17. The system default `java` may be another JDK, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not yet compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03

# Minecraft
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.20.2)
# Every game version this one jar is listed under: the 1.20.1 rung covers 1.20.1 alone.
supported_minecraft_versions=1.20.1
# Forge. The Forge jar also runs on NeoForge 1.20.1, a Forge-compatible fork, so its upload names both.
forge_version=47.4.20
forge_version_range=[47,)
loader_version_range=[47,)

# Architectury / multi-loader
architectury_plugin_version=3.4.164
architectury_loom_version=1.7.435
architectury_version=9.2.14
enabled_platforms=fabric,forge

# Fabric
fabric_loader_version=0.16.10
fabric_api_version=0.92.2+1.20.1

# Cloth Config (Fabric only) — backs the Fabric AutoConfig config screen.
cloth_config_version=11.1.136
# Compiled against only, for its config screen entrypoint: Mod Menu is the player's to install.
modmenu_version=7.2.2

# Other dev-runtime dependencies
appleskin_forge_version=mc1.20.1-2.5.1
appleskin_fabric_version=mc1.20.1-2.5.2
jei_version=15.20.0.130
emi_version=1.1.22+1.20.1

# Which recipe viewer(s) to load at runtime. Valid values: jei, emi, both, none.
# The mod ships plugins for BOTH; this only picks what loads in the dev run.
# Override at the command line with: ./gradlew :forge:runClient -Precipe_viewer=emi
recipe_viewer=jei

# Create (optional compat — Mechanical Press / Washing recipes, Forge only). compileOnly always, so the compat
# datagen compiles. Create 6 for Forge 1.20.1, from the Create maven (its build number is part of the version there).
create_version=6.0.8-289
ponder_version=1.0.91
flywheel_version=1.0.5
registrate_version=MC1.20-1.3.3

# Whether to load Create at runtime (dev + datagen). Set false to test/build without Create.
# Override at the command line with: ./gradlew :forge:runClient -Penable_create=false
enable_create=true

# Farmer's Delight (optional compat — the Lead Knife). Forge only: Fabric compiles against a
# local stub of FD Refabricated's KnifeItem, because architectury-loom can't consume the FDR jar.
farmersdelight_forge_version=1.20.1-1.3.1

# Whether to load FD at runtime (dev + the `--existing-mod farmersdelight` datagen arg). FD is
# ALWAYS compileOnly, so the compat classes build either way.
#   ./gradlew :forge:runClient -PloadFD=false
loadFD=true

# Mods that backport newer vanilla content and others the mod supports, each compiled against always and loaded in
# the dev runs only while its switch is on: ./gradlew :forge:runClient -Penable_mekanism=false
# Vanilla Backport, for the Lead Spear, the Lead Nautilus Armor and Sulfur Cubes. Only in Forge's datagen: its sulfur
# caves mixin crashes a dev run's worlds, and Fabric's dev runs can't unpack the libraries it bundles.
enable_vanilla_backport=true
# Yori3o's Grappling Hooks (Forge), for the Lead Grappling Hook.
enable_grappling_hooks=true
# Mekanism (Forge only, 10.4), whose own lead processing takes the mod's ore and raw lead.
enable_mekanism=true

# Modrinth version ids of the mods above, each loader's own, all for 1.20.1.
vanilla_backport_forge_version=oWVWW4Xg
vanilla_backport_fabric_version=SgvHEKg5
platform_forge_version=28ghzOb2
platform_fabric_version=vghFfekW
grappling_hooks_forge_version=jZnX7Gux
yacl_forge_version=sCWgXDYQ
# Mekanism 10.4.16.80.
mekanism_version=uxe1WQp4

# Publishing — Modrinth / CurseForge project IDs (PUBLIC identifiers, not secrets).
# Tokens come from the account-wide MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars in CI, falling back
# to modrinth_token / curseforge_token in the global ~/.gradle/gradle.properties for local runs.
mod_publish_plugin_version=2.0.0
modrinth_project_id=zv6Yo2mC
curseforge_project_id=1544260
