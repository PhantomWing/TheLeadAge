## Mod info
mod_version=1.1.0
mod_id=theleadage
mod_group_id=com.phantomwing.theleadage
mod_license=MIT License
mod_name=The Lead Age
mod_description=A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# 26.x needs the Gradle daemon itself on JDK 25 (not just the toolchain); system default is older.
org.gradle.java.home=C\:\\Users\\calvi\\.jdks\\temurin-25.0.3
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is incompatible with the configuration cache.
org.gradle.configuration-cache=false

# Minecraft 26.3. No Parchment: 26.x ships unobfuscated, so Mojang names ARE the runtime names and
# there is no remap layer left to extend. minecraft_version is the BUILD target,
# supported_minecraft_versions the SET tagged on uploads (see ext.manifestProps in build.gradle).
# 26.3 has no patch releases, so the build target is the bare line version.
minecraft_version=26.3
# Space-separated; drives the manifest range floor (first) + per-upload version tags (all).
supported_minecraft_versions=26.3
# NeoForge has no stable build for 26.3 yet; the whole 26.3.0.x line is beta.
neo_version=26.3.0.16-beta
neo_version_range=[26.3,)
loader_version_range=[4,)

# Architectury / multi-loader. 26.x needs the loom 1.17 line, which has no mappings or remapJar
# step: the loom-no-remap plugin builds plain jars and Shadow bundles :common into each loader jar.
# Architectury API jumped to 22.x for 26.3 (was 21.1.10 on 26.2). Architectury and NeoForge are
# pinned as a PAIR: a mismatched pair fails to construct at datagen time, which is how the 26.2
# port found 21.0.x against NeoForge .88. Verified together on 2026-09-24: build, a full
# datagen regeneration, the gametests and a Fabric server boot. TheSilverAge's published 26.3
# is still on the older 22.0.1 / 26.3.0.8-beta pair.
architectury_plugin_version=3.5.170
architectury_loom_version=1.17.493
architectury_version=22.0.2
enabled_platforms=fabric,neoforge

# Fabric
fabric_loader_version=0.19.5
fabric_api_version=0.161.0+26.3
# The floor DECLARED in fabric.mod.json, and its own property rather than something derived from
# fabric_api_version: that is the BUILD artifact and tracks the HIGHEST supported game version,
# while fabric-api numbers its per-MC lines independently, so an older supported version can carry
# a LOWER number. Declaring a floor that does not exist for the oldest supported version makes the
# mod refuse to load there outright. This must be the newest fabric-api published for the LOWEST
# entry in supported_minecraft_versions.
fabric_api_min_version=0.161.0

# Cloth Config (Fabric only, REAL dep) - backs the Fabric AutoConfig config screen.
cloth_config_version=26.3.159

# JEI. The plugin API is compile-only and lives in :common; the loader jar is dev-runtime
# only, so the integration can actually be exercised in runClient. Never shipped, never required.
# Artifact ids embed ${minecraft_version}.
jei_version=31.7.0.34

# Farmer's Delight Refabricated. Kept as a RECORD of which FDR build the local KnifeItem stub was
# verified against, not resolved by any configuration - see fabric/build.gradle. If you bump it,
# re-verify the stub's constructor shape against the new jar; nothing checks it automatically.
fdr_version=26.3-3.6.27

# Publishing - Modrinth / CurseForge project IDs (PUBLIC identifiers, not secrets).
# Tokens come from the account-wide MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars in CI, falling back
# to modrinth_token / curseforge_token in the global ~/.gradle/gradle.properties for local runs.
mod_publish_plugin_version=2.0.0
modrinth_project_id=zv6Yo2mC
curseforge_project_id=1544260
