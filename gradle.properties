## Mod info
mod_version=1.1.0
mod_id=theleadage
mod_group_id=com.phantomwing.theleadage
mod_license=MIT License
mod_name=The Lead Age
mod_description=A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21. The system
# default `java` may be an older JDK, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not yet compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.10
parchment_mappings_version=2025.10.12

# Minecraft 1.21.10. 1.21.9 is compatible, so the mod supports BOTH: minecraft_version is the
# BUILD target (highest), supported_minecraft_versions is the SET that is tagged on uploads and
# that drives the manifest range floor (see ext.manifestProps in the root build.gradle).
minecraft_version=1.21.10
minecraft_version_range=[1.21.9,1.21.11)
# Game versions tagged on the Modrinth/CurseForge uploads (space or comma separated). Kept separate
# from the build target so a release can advertise every version it actually runs on.
supported_minecraft_versions=1.21.9 1.21.10
# 1.21.9 stayed beta (last 21.9.16-beta); 1.21.10 has STABLE NeoForge - 21.10.64 is latest. The
# range floor 21.9 covers a 1.21.9 client on its beta NeoForge; the minecraft range above caps it.
neo_version=21.10.64
neo_version_range=[21.9,)
loader_version_range=[4,)

# Architectury / multi-loader. 1.21.10 stays on loom 1.14; Gradle wrapper stays 8.12.
# Architectury API jumped to 18.x for 1.21.9/1.21.10 (was 17.0.8 on 1.21.7/1.21.8).
# Versions match TheSilverAge branch version/1.21.10.
architectury_plugin_version=3.4.164
architectury_loom_version=1.14.476
architectury_version=18.0.8
enabled_platforms=fabric,neoforge

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.138.4+1.21.10
# The floor DECLARED in fabric.mod.json. Deliberately NOT derived from fabric_api_version above:
# that is the BUILD artifact and tracks the highest supported game version, while fabric-api numbers
# its per-MC lines independently. The 1.21.9 line stops at 0.134.1, so a floor of 0.138.4 is
# unreachable on 1.21.9 and the mod refuses to load there outright. This must be the newest
# fabric-api published for the LOWEST entry in supported_minecraft_versions.
fabric_api_min_version=0.134.1

# Cloth Config (Fabric only, REAL dep) — backs the Fabric AutoConfig config screen.
# 20.0.149 is the 1.21.9/1.21.10 build (was 19.0.147 on 1.21.7/1.21.8).
cloth_config_version=20.0.149

# JEI. The plugin API is compile-only and lives in :common; the loader jar is dev-runtime
# only, so the integration can actually be exercised in runClient. Never shipped, never required.
jei_version=26.3.0.31

# Farmer's Delight Refabricated (Fabric only, COMPILE-ONLY). Never shipped and never in the dev
# runtime: it exists so the Lead Knife's superclass is the real KnifeItem at compile time, which
# makes the compiler check the shape that would otherwise only fail on a player's machine.
fdr_version=1.21.10-3.4.2

# Other dev-runtime dependencies (never shipped). AppleSkin: still DROPPED on this line. A
# 3.0.7/3.0.8+mc1.21.9 build now exists for both loaders; it is dev-only, so re-add
# appleskin_*_version if you want it back in runClient.

# --- 1.21.9 / 1.21.10 PORT NOTES ("The Copper Age") ---------------------------
# 1.21.9 is a FEATURE update and, unlike the 1.21.7/1.21.8 pair, it is NOT source-compatible.
# What actually broke here (all verified against the 1.21.10 jars, not guessed):
#   * Level.isClientSide is private - the isClientSide() accessor replaces it (13 call sites).
#   * Blocks.CHAIN -> Blocks.IRON_CHAIN, and the model minecraft:block/chain is GONE. The lead
#     chain now parents to minecraft:block/template_chain (the shape iron/copper chains share).
#     This one passes javac AND datagen and only fails at resource load.
#   * Block entity rendering is submission-based: BlockEntityRenderer gained a render-state type
#     param and split render() into extractRenderState() + submit(). The leaded glass door and
#     trapdoor renderers were rewritten around LeadedGlassSurfaceRenderState.
#   * SpecialModelRenderer.render() -> submit(), and Unbaked.bake() takes a BakingContext.
#   * ModelManager#getAtlas is gone - atlases come from Minecraft#getAtlasManager now.
#   * NeoForge: FMLEnvironment.dist -> getDist(), and IModFile#findResource was removed (the
#     Create-override pack resolves its root through getContents().getContentRoots()).
#   * pack.mcmeta: pack_format -> min_format + max_format. 69 is the 1.21.9/1.21.10 format.
# 1.21.10 is the stable follow-up to 1.21.9; built against 1.21.10, supports 1.21.9 + 1.21.10.
#
# Availability verified against the JEI maven + Modrinth API for 1.21.9/1.21.10:
#   * JEI: 26.3.0.31 ships 1.21.10 artifacts for BOTH loaders - recipe-viewer plugin stays.
#   * FD Refabricated (Fabric): 1.21.10-3.4.2 covers 1.21.9 + 1.21.10 - the Lead Knife stays.
#   * Create, Farmers Delight (NeoForge), EMI: still no build - compat stays dropped.
#   * Architectury API jumped to 18.x; Cloth Config to 20.x.
# --------------------------------------------------------------------------------

