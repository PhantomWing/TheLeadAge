#   * JEI: 24.2.0.6 ships 1.21.8 artifacts for BOTH loaders - the recipe-viewer plugin,
#     dropped on the 1.21.6 line (JEI skipped that version), is RESTORED here.
#   * FD Refabricated (Fabric): 1.21.8-3.3.3 EXISTS - the Lead Knife stays.
#   * Create (NeoForge), Farmers Delight (NeoForge), EMI: still no build - compat stays dropped.
#     Fabric's Create Fly gets its recipes from CreateFlyRecipeProvider (see CLAUDE.md).
#   * Vanilla Backport, Copper Age Backport and Mekanism: no 1.21.7/1.21.8 build (checked
#     2026-11-11), so 1.3's Lead Nautilus Armor, Sulfur Cubes, Parched, the 1.21.9 bars,
#     chains and lanterns tags and the Mekanism pack are left out of this line.
#   * NeoForge 21.8.53 is a stable release (1.21.6 was a beta).
# --------------------------------------------------------------------------------

# Publishing — Modrinth / CurseForge project IDs (PUBLIC identifiers, not secrets).
# Tokens come from the account-wide MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars in CI, falling back
# to modrinth_token / curseforge_token in the global ~/.gradle/gradle.properties for local runs.
mod_publish_plugin_version=2.0.0
modrinth_project_id=zv6Yo2mC
curseforge_project_id=1544260
