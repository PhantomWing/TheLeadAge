## Mod info
mod_version=1.1.0
mod_id=theleadage
mod_group_id=com.phantomwing.theleadage
mod_license=MIT License
mod_name=The Lead Age
mod_description=A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21. The system
# default `java` may be an older JDK, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not yet compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Minecraft 1.21.11, STANDALONE. There is no 1.21.12 (the 1.21.x line ended; Minecraft moved to
# 26.1 versioning next), and 1.21.9/1.21.10 already shipped in the previous release, so this build
# targets 1.21.11 alone with no overlap. minecraft_version is the BUILD target,
# supported_minecraft_versions the SET tagged on uploads (see ext.manifestProps in build.gradle).
minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.21.12)
# Game versions tagged on the Modrinth/CurseForge uploads (space or comma separated). Kept separate
# from the build target so a release can advertise every version it actually runs on.
supported_minecraft_versions=1.21.11
# 1.21.11 has a STABLE NeoForge - 21.11.42. The minecraft range above is the real compat cap.
neo_version=21.11.42
neo_version_range=[21.11,)
loader_version_range=[4,)

# Architectury / multi-loader. 1.21.11 stays on loom 1.14; Gradle wrapper stays 8.12.
# Architectury API jumped to 19.x for 1.21.11 (was 18.0.8 on 1.21.9/1.21.10).
# Versions match TheSilverAge branch version/1.21.11.
architectury_plugin_version=3.4.164
architectury_loom_version=1.14.476
architectury_version=19.0.1
enabled_platforms=fabric,neoforge

# Fabric
# Floor DECLARED in fabric.mod.json as well as the dev-runtime loader. Must be >= whatever the
# pinned fabric-api itself demands - 0.141.4+1.21.11 requires >=0.17.3 - or the manifest advertises
# a loader on which its own required dependency cannot load. Gradle silently resolves a newer
# loader in dev, so this only ever bites players.
fabric_loader_version=0.17.3
fabric_api_version=0.141.4+1.21.11
# The floor DECLARED in fabric.mod.json, and its own property rather than something derived from
# fabric_api_version: that is the BUILD artifact and tracks the HIGHEST supported game version,
# while fabric-api numbers its per-MC lines independently, so an older supported version can carry
# a LOWER number. Declaring a floor that does not exist for the oldest supported version makes the
# mod refuse to load there outright (it bit the 1.21.9/1.21.10 pair, whose 1.21.9 line stopped at
# 0.134.1). This must be the newest fabric-api published for the LOWEST entry in
# supported_minecraft_versions - on this branch that is 1.21.11 alone, so it equals the build.
fabric_api_min_version=0.141.4

# Cloth Config (Fabric only, REAL dep) — backs the Fabric AutoConfig config screen.
# 21.11.153 is the 1.21.11 build (was 20.0.149 on 1.21.9/1.21.10).
cloth_config_version=21.11.153

# JEI. The plugin API is compile-only and lives in :common; the loader jar is dev-runtime
# only, so the integration can actually be exercised in runClient. Never shipped, never required.
jei_version=27.6.0.28
# PINNED, not latest. JEI 27.7.0.29 and newer are built with Loom 1.17.x and carry
# Fabric-Loom-Mixin-Remap-Type: static, which makes architectury-loom 1.14.476 refuse them
# outright ("Mod was built with a newer version of Loom"). 27.6.0.28 is the newest 1.21.11
# build still on Loom 1.14.5. Raise this only alongside a loom upgrade.

# Farmer's Delight Refabricated. NOT a dependency on this line and NOT resolved by any
# configuration - see fabric/build.gradle for why (classTweaker v2 vs loom 1.14.476). It is kept as
# a RECORD of which FDR build the local KnifeItem stub was javap-verified against. If you bump it,
# re-verify the stub's constructor shape against the new jar; nothing checks it automatically.
fdr_version=1.21.11-3.6.16

# Other dev-runtime dependencies (never shipped). AppleSkin: still DROPPED, as since the 1.21.4
# line. It is dev-only, so re-add appleskin_*_version if you want it back in runClient.

# --- 1.21.11 PORT NOTES ---------------------------------------------------------
# A standalone bugfix follow-up to the Copper Age line, and mostly a RENAME/REORG update per the
# primer (docs.neoforged.net/primer/docs/1.21.11/). All of the below was verified against the
# 1.21.11 jars, not guessed:
#   * ResourceLocation is RENAMED to Identifier (net.minecraft.resources.Identifier). Mod-wide.
#     ResourceKey#location() likewise becomes #identifier().
#   * Package moves: net.minecraft.Util -> net.minecraft.util.Util; advancements.critereon ->
#     advancements.criterion (the old typo is finally fixed); entity.npc.VillagerProfession /
#     VillagerTrades -> entity.npc.villager.*; entity.monster.Pillager -> entity.monster.illager.*;
#     client.renderer.RenderType -> client.renderer.rendertype.RenderType.
#   * BakedQuad is now a RECORD of four Vector3fc positions and four PACKED uv longs, replacing the
#     interleaved int[] vertex array. UVPair.pack/unpackU/unpackV do the packing, and the values are
#     absolute atlas coordinates. LeadedGlassClearSprite's sprite swap was rewritten around it.
#   * SpecialModelRenderer#getExtents takes a Consumer<Vector3fc>, not a Set<Vector3f>.
#   * RenderType.cutout() is gone; Sheets.cutoutBlockSheet() is the item-context equivalent.
#   * VillagerTrades.ItemListing#getOffer gained a leading ServerLevel parameter.
#   * pack.mcmeta: format 75 (read from the client jar's own version.json, resource_major).
#
# Availability verified against the JEI maven + Modrinth API for 1.21.11:
#   * JEI: PINNED to 27.6.0.28, NOT latest. 27.7.0.29+ are built with Loom 1.17.x and carry
#     Fabric-Loom-Mixin-Remap-Type: static, which architectury-loom 1.14.476 refuses outright.
#   * FD Refabricated: a real 1.21.11-3.6.16 exists, but every 1.21.11 build ships a
#     `classTweaker v2` file that loom 1.14.476 cannot parse, and merely having it on the classpath
#     fails :fabric configuration. The Lead Knife therefore compiles against the local stub in
#     fabric/.../vectorwing/, whose shape was javap-verified against the real jar. Runtime binding
#     to the real FDR class is unaffected. Reading v2 needs the loom 1.17.x line, which is the
#     26.1 build overhaul (Gradle 9 + Java 25).
#   * Create, Farmers Delight (NeoForge), EMI: still no build - compat stays dropped.
#   * Architectury API jumped to 19.x; Cloth Config to 21.x.
# --------------------------------------------------------------------------------

