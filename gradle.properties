## Mod info
mod_version=1.3.1
mod_id=theleadage
mod_group_id=com.phantomwing.theleadage
mod_license=MIT License
mod_name=The Lead Age
mod_description=A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
mod_authors=PhantomWing

# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
# Architectury Loom requires the Gradle daemon itself to run on JDK 21. The system
# default `java` may be an older JDK, so the daemon JVM is pinned explicitly here.
# Adjust this path (or override in a non-committed gradle.properties /
# via -Dorg.gradle.java.home=) if your JDK 21 lives elsewhere.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.7.6-hotspot
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Architectury Loom is not yet compatible with the Gradle configuration cache.
org.gradle.configuration-cache=false

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21
parchment_mappings_version=2024.07.28

# Minecraft
minecraft_version=1.21.1
minecraft_version_range=[1.21,1.21.2)
# Game versions tagged on the Modrinth/CurseForge uploads (space or comma separated). Kept separate
# from the build target so a release can advertise every version it actually runs on. 1.21 holds because
# the Fabric jar asks for fabric-api >=0.102.0, the newest for 1.21, and compiles against it.
supported_minecraft_versions=1.21 1.21.1
# The NeoForge upload is listed under this version alone: neo_version_range needs NeoForge 21.1,
# which exists for 1.21.1 only. The Fabric upload keeps the whole list above.
neoforge_minecraft_versions=1.21.1
# 21.1.219 is the dev/compile version: Farmer's Delight 1.3.1 refuses to load below it. The mod
# itself still runs on 21.1.218+, so the published range deliberately stays lower.
neo_version=21.1.219
neo_version_range=[21.1.218,)
loader_version_range=[4,)

# Architectury / multi-loader
architectury_plugin_version=3.4.164
architectury_loom_version=1.7.435
architectury_version=13.0.8
enabled_platforms=fabric,neoforge

# Fabric
fabric_loader_version=0.16.14
fabric_api_version=0.116.12+1.21.1

# Cloth Config (Fabric only) — backs the Fabric AutoConfig config screen.
cloth_config_version=15.0.140
# Compiled against only, for its config screen entrypoint: Mod Menu is the player's to install.
modmenu_version=11.0.3

# Other dev-runtime dependencies
appleskin_version=3.0.7
jei_version=19.21.2.313
emi_version=1.1.22+1.21.1

# Which recipe viewer(s) to load at runtime. Valid values: jei, emi, both, none.
# The mod ships plugins for BOTH; this only picks what loads in the dev run.
# Override at the command line with: ./gradlew :neoforge:runClient -Precipe_viewer=emi
recipe_viewer=jei

# Create (optional compat — Mechanical Press / Crushing Wheels recipes, NeoForge only;
# Create has no Fabric 1.21.1 build). compileOnly always, so the compat datagen compiles.
create_version=6.0.9-215
registrate_version=MC1.21-1.3.0+67
ponder_version=1.0.81
flywheel_version=1.0.6

# Whether to load Create at runtime (dev + datagen). Set false to test/build without Create.
# Override at the command line with: ./gradlew :neoforge:runClient -Penable_create=false
enable_create=true

# Farmer's Delight (optional compat — the Lead Knife). NeoForge only: Fabric compiles against a
# local stub of FD Refabricated's KnifeItem, because architectury-loom can't consume the FDR jar.
farmersdelight_neoforge_version=1.21.1-1.3.1

# Whether to load FD at runtime (dev + the `--existing-mod farmersdelight` datagen arg). FD is
# ALWAYS compileOnly, so the compat classes build either way.
#   ./gradlew :neoforge:runClient -PloadFD=false
loadFD=true

# Mods that backport newer vanilla content and others the mod supports, each compiled against always and loaded in
# the dev runs only while its switch is on: ./gradlew :neoforge:runClient -Penable_mekanism=false
# Backported Spears (NeoForge), for the Lead Spear. Its Fabric build asks for Fabric Loader 0.18.1, past this line's.
enable_backported_spears=true
# Vanilla Backport, for the Lead Spear on Fabric, the Lead Nautilus Armor and Sulfur Cubes. On NeoForge only in
# datagen, since it crashes a client with Backported Spears (neoforge/build.gradle).
enable_vanilla_backport=true
# Yori3o's Grappling Hooks (NeoForge), for the Lead Grappling Hook. Its Fabric build asks for Fabric Loader 0.19.
enable_grappling_hooks=true
# Mekanism (NeoForge only), whose own lead processing takes the mod's ore and raw lead.
enable_mekanism=true

# Modrinth version ids of the mods above, each loader's own.
backported_spears_neoforge_version=FROwtXRs
backported_spears_fabric_version=pBxqKUpa
vanilla_backport_neoforge_version=mGS7BxD4
vanilla_backport_fabric_version=pdLJZwZ1
platform_neoforge_version=rh4p4ixM
platform_fabric_version=UBpoaJQa
grappling_hooks_neoforge_version=lf4DqQBf
yacl_neoforge_version=7TVdVtxF
# Mekanism 10.7.19.85.
mekanism_version=5KzzycBT

# Publishing — Modrinth / CurseForge project IDs (PUBLIC identifiers, not secrets).
# Tokens come from the account-wide MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars in CI, falling back
# to modrinth_token / curseforge_token in the global ~/.gradle/gradle.properties for local runs.
mod_publish_plugin_version=2.0.0
modrinth_project_id=zv6Yo2mC
curseforge_project_id=1544260
