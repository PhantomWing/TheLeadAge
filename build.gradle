plugins {
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    // Publishing â€” applied per loader subproject.
    id 'me.modmuss50.mod-publish-plugin' version "${mod_publish_plugin_version}" apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

// Per-release changelog: notes under the first "# X.Y.Z" header in changelog.md, up to the next "# ".
ext.latestChangelog = {
    def f = rootProject.file('changelog.md')
    if (!f.exists()) return "See changelog.md"
    def body = new StringBuilder()
    boolean started = false, done = false
    f.eachLine { line ->
        if (done) return
        if (line.startsWith('# ')) {
            if (started) { done = true; return }
            started = true
            return
        }
        if (started) body.append(line).append('\n')
    }
    def out = body.toString().trim()
    return out.isEmpty() ? "See changelog.md" : out
}

// Single source of truth for the manifest substitutions. Derives each dependency range in the
// loader's required FORMAT from the canonical versions in gradle.properties, so fabric.mod.json
// and neoforge.mods.toml never hold a hardcoded range that can drift on a port.
//   Fabric predicate format: ">=1.21.9 <1.21.11"     NeoForge maven range: "[1.21.9,1.21.11)"
ext.manifestProps = { ->
    def mc = rootProject.minecraft_version                          // build target = highest supported
    def p = mc.tokenize('.')
    def mcNext = "${p[0]}.${p[1]}.${(p[2] as int) + 1}".toString()   // 1.21.10 -> 1.21.11 (exclusive upper)
    // Floor = LOWEST supported game version, which differs from the build target whenever the
    // mod spans a compatible pair (1.21.9 + 1.21.10).
    def mcFloor = rootProject.supported_minecraft_versions.tokenize(' ,').first()
    // major.minor of a version, ignoring any +build / -qualifier suffix.
    def mm = { String v -> def q = v.takeWhile { it != '+' && it != '-' }.tokenize('.'); "${q[0]}.${q[1]}".toString() }
    def fabricApiFloor = rootProject.fabric_api_version.takeWhile { it != '+' }   // 0.138.4+1.21.10 -> 0.138.4
    return [
            version                  : rootProject.mod_version,
            dep_minecraft_fabric     : ">=${mcFloor} <${mcNext}".toString(),
            dep_fabricloader         : ">=${rootProject.fabric_loader_version}".toString(),
            dep_fabric_api           : ">=${fabricApiFloor}".toString(),
            dep_architectury_fabric  : ">=${mm(rootProject.architectury_version)}".toString(),
            dep_cloth                : ">=${mm(rootProject.cloth_config_version)}".toString(),
            dep_loader_neoforge      : rootProject.loader_version_range,
            dep_neoforge             : rootProject.neo_version_range,
            dep_minecraft_neoforge   : "[${mcFloor},${mcNext})".toString(),
            dep_architectury_neoforge: "[${mm(rootProject.architectury_version)},)".toString(),
    ]
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // Mojang official mappings, layered with Parchment.
        mappings loom.layered {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
        }
    }
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${mod_id}-${project.name}-${minecraft_version}"
    }

    version = mod_version
    group = mod_group_id

    repositories {
        mavenLocal()

        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.parchmentmc.org' }

        // AppleSkin (dev-runtime only)
        maven {
            url = "https://maven.ryanliptak.com/"
        }

        // JEI (dev-runtime only)
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "ModMaven"
            url = "https://modmaven.dev"
        }

        // Cloth Config â€” a real (shipped) Fabric dependency backing the Fabric
        // AutoConfig config screen. Scoped to the Cloth Config group so this
        // maven does not broaden resolution for anything else.
        maven {
            name = "shedaniel"
            url = "https://maven.shedaniel.me/"
            content { includeGroup "me.shedaniel.cloth" }
        }

        // CurseForge mods (dev-runtime only â€” e.g. The Silver Age for side-by-side
        // comparison). Scoped to the curse.maven group so it doesn't broaden
        // resolution for anything else.
        maven {
            name = "CurseMaven"
            url = "https://cursemaven.com"
            content { includeGroup "curse.maven" }
        }

        // Modrinth mods, currently only the compile-only Farmer's Delight Refabricated used to
        // typecheck the Fabric Lead Knife. Scoped to the maven.modrinth group.
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }

        // EMI (recipe viewer â€” plugin lives in common, so both loaders use it).
        maven {
            name = "TerraformersMC"
            url = "https://maven.terraformersmc.com/"
        }

        // Modrinth Maven â€” Farmer's Delight (NeoForge optional compat).
        maven {
            url = "https://api.modrinth.com/maven"
            content { includeGroup "maven.modrinth" }
        }

        // Create (+ Ponder, Flywheel) â€” optional NeoForge compat.
        maven { url = "https://maven.createmod.net" }

        // Registrate â€” a transitive dependency of Create.
        maven { url = "https://maven.ithundxr.dev/snapshots" }
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    java {
        withSourcesJar()
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
