plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    neoForge {
    }
}

// Resolved outside the loom { runs { } } closures so the data-generation paths
// are available to the RunConfigSettings delegate.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath

// Client HUD niceties (JEI, AppleSkin) + the side-by-side comparison mod (The
// Silver Age) are useless — and can hang/crash — in the headless game-test and
// data-generation runs. Only load them for runClient/runServer.
def runningGameTest = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
def runningDataGen = gradle.startParameter.taskNames.any { it.toLowerCase().contains('data') }

// Create is a real (optional) integration, not a dev nicety: the compat recipe gens extend Create's
// own providers, so it must be on the DATAGEN runtime classpath too — unlike the mods above.
//   ./gradlew :neoforge:runClient -Penable_create=false
def loadCreate = (project.findProperty('enable_create') ?: rootProject.enable_create).toString().toBoolean()

// Farmer's Delight (the Lead Knife). Like Create, a real integration rather than a dev nicety: it must
// be on the DATAGEN classpath too, so `--existing-mod farmersdelight` below can resolve FD's resources.
//   ./gradlew :neoforge:runClient -PloadFD=false
def loadFD = (project.findProperty('loadFD') ?: rootProject.loadFD).toString().toBoolean()

// Which recipe viewer to load in the dev run. The mod ships plugins for BOTH JEI and EMI; running
// them together is just noise, so pick one:
//   ./gradlew :neoforge:runClient -Precipe_viewer=jei|emi|both|none
def selectedRecipeViewer = (project.findProperty('recipe_viewer') ?: rootProject.recipe_viewer).toString()
if (!['jei', 'emi', 'both', 'none'].contains(selectedRecipeViewer)) {
    throw new GradleException("Invalid recipe_viewer='${selectedRecipeViewer}'. Valid values: jei, emi, both, none")
}
def loadJei = selectedRecipeViewer == 'jei' || selectedRecipeViewer == 'both'
def loadEmi = selectedRecipeViewer == 'emi' || selectedRecipeViewer == 'both'
logger.lifecycle("[TheLeadAge] (neoforge) Recipe viewer: ${selectedRecipeViewer} (JEI=${loadJei}, EMI=${loadEmi}), Create: ${loadCreate}, FD: ${loadFD}")

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    // Include the test-only source set in the dev mod definition so NeoForge's
    // @GameTestHolder scan discovers the game tests. Dev-runtime only — the
    // production jar is still built from `main`, so test classes never ship.
    mods {
        register('theleadage') {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }

    runs {
        // NeoForge data generation. Output + existing-resource paths point at the
        // common source set (datagen output is shared across loaders).
        //   ./gradlew :neoforge:runData
        data {
            data()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
            // FD's existing resources only exist when FD is on the run classpath; asking for them
            // otherwise fails datagen outright.
            if (loadFD) programArgs('--existing-mod', 'farmersdelight')
        }

        // Headless NeoForge game-test server: runs every @GameTest in the
        // `theleadage` namespace, prints PASS/FAIL, and exits.
        //   ./gradlew :neoforge:runGameTest
        gameTest {
            server()
            name = "Game Test"
            runDir "run/gametest"
            source sourceSets.test
            property 'neoforge.enableGameTest', 'true'
            property 'neoforge.gameTestServer', 'true'
            property 'neoforge.enabledGameTestNamespaces', 'theleadage'
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// Test-only source set for game tests. Kept out of `main` so neither the test
// classes nor the empty.nbt structure ship in the production jar. It inherits
// main's full compile/runtime classpath plus main's output.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    // Architectury API (NeoForge).
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // ---- Create (optional compat) ----
    // compileOnly ALWAYS so the compat datagen classes still compile with Create toggled off.
    // Never shipped, never a hard dependency — every generated Create recipe is mod_loaded-gated.
    modCompileOnly("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.create_version}:slim") { transitive = false }
    modCompileOnly("com.tterrag.registrate:Registrate:${rootProject.registrate_version}")
    // NOT on the game-test classpath: Create crashes the headless GameTestServer outright
    // ("Payload create:clientbound_chain_conveyor may not be sent to the client!" — it pushes a
    // client-only payload on a server with no client). Datagen DOES need it, hence !runningGameTest
    // rather than the !runningDataGen guard used for the dev niceties below.
    if (loadCreate && !runningGameTest) {
        modLocalRuntime("com.simibubi.create:create-${rootProject.minecraft_version}:${rootProject.create_version}:slim") { transitive = false }
        modLocalRuntime("net.createmod.ponder:ponder-neoforge:${rootProject.ponder_version}+mc${rootProject.minecraft_version}")
        modLocalRuntime("dev.engine-room.flywheel:flywheel-neoforge-${rootProject.minecraft_version}:${rootProject.flywheel_version}")
        modLocalRuntime("com.tterrag.registrate:Registrate:${rootProject.registrate_version}")
    }

    // ---- Farmer's Delight (optional compat) ----
    // compileOnly ALWAYS so LeadKnifeItem (which extends FD's KnifeItem) compiles with FD toggled off.
    // Never shipped, never a hard dependency — the item falls back to a plain SwordItem without FD.
    modCompileOnly "maven.modrinth:farmers-delight:${rootProject.farmersdelight_neoforge_version}"
    // Also kept off the game-test classpath: the tests cover this mod's own mechanics, so third-party
    // mods there only add load time and failure modes (datagen still gets it).
    if (loadFD && !runningGameTest) {
        modLocalRuntime "maven.modrinth:farmers-delight:${rootProject.farmersdelight_neoforge_version}"
    }

    // ---- Dev-runtime niceties (modLocalRuntime ONLY — never compiled against,
    //      never shipped, never a hard dependency). Skipped for the game-test run. ----
    if (!runningGameTest && !runningDataGen) {
        if (loadJei) {
            modLocalRuntime("mezz.jei:jei-1.21.1-neoforge:${rootProject.jei_version}")
        }
        if (loadEmi) {
            modLocalRuntime("dev.emi:emi-neoforge:${rootProject.emi_version}")
        }
        modLocalRuntime("squeek.appleskin:appleskin-neoforge:mc1.21-${rootProject.appleskin_version}")
        // The Silver Age (sibling mod) from CurseForge, for side-by-side comparison.
        modLocalRuntime("curse.maven:the-silver-age-1355287:8190186")
    }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

// Publishing (NeoForge jar). ./gradlew :neoforge:publishMods (tokens via MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars).
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    file = remapJar.archiveFile
    version = rootProject.mod_version
    displayName = "The Lead Age ${rootProject.mod_version}"
    changelog = rootProject.ext.latestChangelog()
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        // Tag every supported game version on the upload, not just the build target.
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // NeoForge only needs Architectury — fabric-api / cloth-config are Fabric-only.
        requires("architectury-api")
        optional("create", "farmers-delight", "jei", "emi")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("architectury-api")
        optional("create", "farmers-delight", "jei", "emi")
    }
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
