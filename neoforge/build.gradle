plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    neoForge {
    }
}

// Resolved outside the loom { runs { } } closures so the data-generation paths
// are available to the RunConfigSettings delegate.
def datagenModId = rootProject.property('mod_id').toString()
def datagenOutput = rootProject.file('common/src/generated/resources/').absolutePath
def datagenExisting = rootProject.file('common/src/main/resources/').absolutePath

// A recipe viewer is useless in the headless game-test and data-generation runs and can hang or
// crash them, so the dev-runtime JEI below is skipped for those task names.
def runningGameTest = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
def runningDataGen = gradle.startParameter.taskNames.any { it.toLowerCase().contains('data') }

// 1.21.5: JEI is back, so the recipe-viewer plugin ships again. Farmer's Delight (Refabricated) is
// Fabric-only, and Create, FD-NeoForge and EMI publish no 1.21.5 build, so their compat stays
// dropped along with the recipe_viewer switch (JEI is the only viewer here).
// See the port notes in gradle.properties.
logger.lifecycle("[TheLeadAge] (neoforge) 1.21.5 branch: JEI restored; no Create/FD-NeoForge/EMI compat")

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    // Include the test-only source set in the dev mod definition so NeoForge's
    // @GameTestHolder scan discovers the game tests. Dev-runtime only — the
    // production jar is still built from `main`, so test classes never ship.
    mods {
        register('theleadage') {
            sourceSet sourceSets.main
            sourceSet sourceSets.test
        }
    }

    runs {
        // NeoForge data generation. Output + existing-resource paths point at the
        // common source set (datagen output is shared across loaders).
        //   ./gradlew :neoforge:runData
        // NeoForge 21.4 split the old `data` run template into clientData + serverData; loom 1.10's
        // data() maps to the removed template. clientData() is a superset environment, so one run
        // with --all emits both the client model providers and the server data providers.
        data {
            clientData()
            name = "Data Generation"
            programArgs('--mod', datagenModId, '--all', '--output', datagenOutput, '--existing', datagenExisting)
        }

        // Headless NeoForge game-test server: runs every registered test instance,
        // prints PASS/FAIL, and exits.
        //   ./gradlew :neoforge:runGameTest
        // 21.5: the old neoforge.gameTestServer / enabledGameTestNamespaces properties are dead.
        // The run must use the userdev gameTestServer template (launch target
        // neoforgegametestserverdev), which both enables and auto-runs the tests; with server()
        // it boots as a plain dedicated server and idles instead.
        gameTest {
            // The environment name selects the <env>Args section of loom's launch.cfg, so it must
            // match the template name (the way clientData() pairs with dataClient).
            environment('gameTestServer')
            forgeTemplate('gameTestServer')
            name = "Game Test"
            runDir "run/gametest"
            source sourceSets.test
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

// Test-only source set for game tests. Kept out of `main` so neither the test
// classes nor the empty.nbt structure ship in the production jar. It inherits
// main's full compile/runtime classpath plus main's output.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    // Architectury API (NeoForge).
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }

    // JEI, dev runtime only, so the plugin can actually be exercised in runClient. Kept out of the
    // headless game-test and data-generation runs, where a recipe viewer is useless and can hang them.
    if (!runningGameTest && !runningDataGen) {
        modLocalRuntime "mezz.jei:jei-1.21.5-neoforge:${rootProject.jei_version}"
    }

    // NOTE (1.21.5 branch): no other dev-runtime niceties, since AppleSkin has no 1.21.4/1.21.5 build.
}

// A widened member missing from the access transformer still compiles and runs in dev, then throws
// IllegalAccessError on a user's machine. Fail the build instead.
def verifyAccessTransformer = tasks.register('verifyAccessTransformer') {
    def widener = project(':common').loom.accessWidenerPath.get().asFile
    def transformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    inputs.files(widener, transformer)
    doLast {
        def at = transformer.text
        def missing = widener.readLines()
                .findAll { it =~ /^\s*(accessible|extendable|mutable)\s/ }
                .collect { it.trim().split('\\s+') }
                .findAll { parts ->
                    def owner = parts[2].replace('/', '.')
                    def member = parts.size() > 3 ? "\\s+\\Q${parts[3]}\\E(?=[\\s(]|\$)" : ''
                    !(at =~ /(?m)^\s*\S+\s+\Q${owner}\E${member}/)
                }
                .collect { it.join(' ') }
        if (missing) {
            throw new GradleException("${transformer.name} is missing access widener entries, so these "
                    + "would throw IllegalAccessError in production:\n  " + missing.join('\n  '))
        }
    }
}

processResources {
    dependsOn verifyAccessTransformer
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

// Publishing (NeoForge jar). ./gradlew :neoforge:publishMods (tokens via MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars).
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    file = remapJar.archiveFile
    version = rootProject.mod_version
    displayName = "The Lead Age ${rootProject.mod_version}"
    changelog = rootProject.ext.latestChangelog()
    type = STABLE
    modLoaders.add("neoforge")
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        // Tag every supported game version on the upload, not just the build target.
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // NeoForge only needs Architectury — fabric-api / cloth-config are Fabric-only.
        requires("architectury-api")
        optional("jei")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("architectury-api")
        optional("jei")
    }
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = "${rootProject.mod_id}-neoforge"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
