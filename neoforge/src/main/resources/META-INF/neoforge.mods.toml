modLoader = "javafml"
loaderVersion = "${dep_loader_neoforge}"
issueTrackerURL = "https://github.com/PhantomWing/TheLeadAge/issues"
license = "MIT License"

[[mixins]]
config = "theleadage.mixins.json"

[[mods]]
modId = "theleadage"
version = "${version}"
displayName = "The Lead Age"
displayURL = "https://github.com/PhantomWing/TheLeadAge"
logoFile = "icon.png"
authors = "PhantomWing"
description = '''
A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
'''

[[dependencies.theleadage]]
modId = "neoforge"
type = "required"
versionRange = "${dep_neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.theleadage]]
modId = "minecraft"
type = "required"
versionRange = "${dep_minecraft_neoforge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.theleadage]]
modId = "architectury"
type = "required"
versionRange = "${dep_architectury_neoforge}"
ordering = "AFTER"
side = "BOTH"

# JEI publishes for both loaders on this line (26.3.0.31); Create, FD (NeoForge) and EMI still
# publish no 1.21.9/1.21.10 build. FD Refabricated exists on the FABRIC side only.
# See the port notes in gradle.properties.


[[dependencies.theleadage]]
modId = "jei"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"