modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/PhantomWing/TheLeadAge/issues"
license = "MIT License"

[[mixins]]
config = "theleadage.mixins.json"

[[mods]]
modId = "theleadage"
version = "${version}"
displayName = "The Lead Age"
displayURL = "https://github.com/PhantomWing/TheLeadAge"
logoFile = "icon.png"
authors = "PhantomWing"
description = '''
A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
'''

[[dependencies.theleadage]]
modId = "neoforge"
type = "required"
versionRange = "[21.3,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.theleadage]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.2,1.21.4)"
ordering = "NONE"
side = "BOTH"

[[dependencies.theleadage]]
modId = "architectury"
type = "required"
versionRange = "[14.0,)"
ordering = "AFTER"
side = "BOTH"

# ---- Optional integrations. All are `type = "optional"`, so the mod loads happily without any of
# them; `ordering = "AFTER"` only asks the loader to place them before us when they ARE present.
# Farmer's Delight matters most here: LeadKnifeItem extends its KnifeItem, so FD must be loaded
# before our items are constructed. (Dev-only runtime mods such as AppleSkin are NOT listed.)
#
# versionRange is deliberately "[0,)" (any version) on all of them. These mods declare a plain
# semver internally that does NOT match their download filename — Farmer's Delight ships as
# "farmers-delight-1.21.1-1.3.1.jar" but declares version "1.3.1" — so a range written from the
# filename rejects the very build it was meant to allow, and FML then refuses to load at all. An
# optional dep gains nothing from a lower bound anyway: these are advertising + load-order hints.
