modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/PhantomWing/TheLeadAge/issues"
license = "MIT License"

[[mixins]]
config = "theleadage.mixins.json"

[[mods]]
modId = "theleadage"
version = "${version}"
displayName = "The Lead Age"
displayURL = "https://github.com/PhantomWing/TheLeadAge"
logoFile = "icon.png"
authors = "PhantomWing"
description = '''
A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
'''

[[dependencies.theleadage]]
modId = "neoforge"
type = "required"
versionRange = "[21.6,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.theleadage]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.6,1.21.7)"
ordering = "NONE"
side = "BOTH"

[[dependencies.theleadage]]
modId = "architectury"
type = "required"
versionRange = "[17.0,)"
ordering = "AFTER"
side = "BOTH"

# No optional integration dependencies on this line: JEI publishes no 1.21.6 build at all (its
# maven skips 1.21.5 to 1.21.7), and FD (NeoForge), Create and EMI have nothing either. FD
# Refabricated exists on the FABRIC side only. See the port notes in gradle.properties.
