modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/PhantomWing/TheLeadAge/issues"
license = "MIT License"

[[mixins]]
config = "theleadage.mixins.json"

[[mods]]
modId = "theleadage"
version = "${version}"
displayName = "The Lead Age"
displayURL = "https://github.com/PhantomWing/TheLeadAge"
logoFile = "icon.png"
authors = "PhantomWing"
description = '''
A vanilla-friendly expansion that adds lead, a new metal resource. A sister mod to The Silver Age.
'''

[[dependencies.theleadage]]
modId = "neoforge"
type = "required"
versionRange = "[21.4,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.theleadage]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.4,1.21.5)"
ordering = "NONE"
side = "BOTH"

[[dependencies.theleadage]]
modId = "architectury"
type = "required"
versionRange = "[15.0,)"
ordering = "AFTER"
side = "BOTH"

# No optional integration dependencies on this line: Create, Farmer's Delight, JEI and EMI publish
# no 1.21.4 build (JEI has one; its plugin is not yet restored). They come back with their compat (see the port notes in gradle.properties).
