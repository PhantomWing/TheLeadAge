plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

// The dev niceties below can only get in the way of the headless game-test server, which tests this mod alone.
def runningGameTest = gradle.startParameter.taskNames.any { it.toLowerCase().contains('gametest') }
// Create Fly, one switch in gradle.properties:   ./gradlew :fabric:runClient -Penable_create_fly=false
// Not in the portal's server scenarios, its server (an init script named *.server.gradle) or the client that joins it
// (quick play into a server): with Create Fly a dev server's /reload holds its thread over 30 seconds on a busy machine,
// and the client times out. The scenarios test the lead water's range, which Create Fly has nothing to do with.
def playingOnServer = gradle.startParameter.initScripts.any {
    it.name.endsWith('.server.gradle') || (it.name.endsWith('.gradle') && it.isFile() && it.text.contains('--quickPlayMultiplayer'))
}
// Yori3o's Grappling Hooks, off by default (gradle.properties): ./gradlew :fabric:runClient -Penable_grappling_hooks=true
def loadHooks = (project.findProperty('enable_grappling_hooks') ?: rootProject.enable_grappling_hooks).toString().toBoolean()
def loadCreateFly = !playingOnServer && (project.findProperty('enable_create_fly') ?: rootProject.enable_create_fly).toString().toBoolean()

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath

    // The test source set is a mod of its own, theleadage_gametest, whose fabric.mod.json names the class that
    // registers the tests: an entrypoint in the shipped manifest would name a class the jar doesn't have.
    mods {
        register('theleadage_gametest') {
            sourceSet sourceSets.test
        }
    }

    runs {
        // Headless Fabric game-test server: runs the same tests as NeoForge's, prints PASS/FAIL, and exits.
        //   ./gradlew :fabric:runGameTest
        gameTest {
            server()
            name = "Game Test"
            runDir "run/gametest"
            source sourceSets.test
            vmArg '-Dfabric-api.gametest'
        }
    }
}

// Test-only source set for game tests, kept out of `main` so nothing in it ships. The tests are
// common/src/gametest, shared with NeoForge; only the registration and TestLoader are Fabric's own.
sourceSets {
    // Datagen's Fabric-only output: the Create Fly recipes (neoforge/.../datagen/CreateFlyRecipeProvider), in Create
    // Fly's own format, which Create on NeoForge can't read.
    main {
        resources.srcDir file('src/generated/resources')
    }
    test {
        java.srcDir project(':common').file('src/gametest/java')
        resources.srcDir project(':common').file('src/gametest/resources')
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

// 1.21.11: the recipe-viewer plugin is live on a PINNED JEI (27.6.0.28 - newer builds use a Loom
// this toolchain refuses). FDR publishes for 1.21.11 but cannot be a dependency here (classTweaker
// v2), so the Lead Knife compiles against the local stub. EMI still has nothing past 1.21.1.
// See the port notes in gradle.properties.
logger.lifecycle("[TheLeadAge] (fabric) 1.21.11 branch: JEI compat, FD knife via stub; no EMI; Create Fly: ${loadCreateFly}, Grappling Hooks: ${loadHooks}")

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Architectury API (Fabric).
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }

    // Cloth Config — a real (compiled + shipped) Fabric dependency: it backs the
    // Fabric AutoConfig config screen (TheLeadAgeFabricConfig). fabric-api excluded
    // to avoid a transitive downgrade.
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    // Mod Menu opens that screen from its mod list (TheLeadAgeModMenu); compiled against only.
    modCompileOnly("com.terraformersmc:modmenu:${rootProject.modmenu_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // Farmer's Delight Refabricated is NOT a dependency on this line. Its 1.21.11 builds ship a
    // `classTweaker v2` file that the classtweaker reader in architectury-loom 1.14.476 cannot read
    // ("Unsupported class tweaker format: v2"), so merely having it on the classpath fails
    // :fabric configuration. Reading v2 needs the loom 1.17.x line, i.e. the 26.1 build overhaul
    // (Gradle 9 + Java 25), which is well past this branch.
    //
    // LeadKnifeItem therefore compiles against the local stub in vectorwing/farmersdelight/, whose
    // shape was verified with javap against fdr_version's real jar. Re-verify on any fdr_version
    // bump. At runtime the class still binds to the real FDR jar when the player has it installed.

    // JEI, dev runtime only, so the plugin can actually be exercised in runClient.
    if (!runningGameTest) {
        modLocalRuntime "mezz.jei:jei-${rootProject.minecraft_version}-fabric:${rootProject.jei_version}"
    }

    // Create Fly, the Fabric port of Create: never compiled against. Its recipes are ours, written by NeoForge's datagen
    // into src/generated/resources, which only this jar carries (see sourceSets above). The game tests load it too.
    if (loadCreateFly) {
        modLocalRuntime("maven.modrinth:create-fly:${rootProject.create_fly_version}")
    }
    // Yori3o's Grappling Hooks, which reads the Lead Grappling Hook from Fabric's yo_hooks/hooks.json.
    if (loadHooks && !runningGameTest) {
        modLocalRuntime("maven.modrinth:yori3os-grappling-hooks:${rootProject.grappling_hooks_fabric_version}") { transitive = false }
    }

    // NOTE (1.21.11 branch): no other dev-runtime niceties. AppleSkin stays out; it is dev-only and
    // was dropped back on the 1.21.4 line.
}

processResources {
    // Single-sourced manifest values (version + dependency ranges) derived from
    // gradle.properties, see rootProject.ext.manifestProps in the root build.gradle.
    def manifest = rootProject.ext.manifestProps()
    inputs.properties(manifest)

    filesMatching('fabric.mod.json') {
        expand(manifest)
    }
}

shadowJar {
    exclude 'architectury.common.json'

    // NOT belt and braces on this line: the KnifeItem STUB under vectorwing/ is real source here, and
    // shipping it would shadow the genuine FDR class (same FQN) for every player who has FDR
    // installed. This exclude is what keeps it out of the jar.
    exclude 'vectorwing/**'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

// Publishing (Fabric jar). ./gradlew :fabric:publishMods (tokens via MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars).
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    file = remapJar.archiveFile
    version = rootProject.mod_version
    displayName = "The Lead Age ${rootProject.mod_version}"
    changelog = rootProject.ext.latestChangelog()
    type = STABLE
    modLoaders.add("fabric")
    // -PpublishDryRun => stage to build/ without uploading.
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        // Tag every supported game version on the upload, not just the build target.
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        requires("architectury-api")
        requires("fabric-api")
        requires("cloth-config")
        optional("jei")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("architectury-api")
        requires("fabric-api")
        requires("cloth-config")
        optional("jei")
    }
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }

    // The compile-time KnifeItem stub must not leave this project in ANY artifact. shadowJar's
    // exclude only covers the mod jar; the sources jar is part of the maven publication, so without
    // this it hands consumers a same-FQN copy of a third-party class.
    exclude 'vectorwing/**'
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "${rootProject.mod_id}-fabric"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
