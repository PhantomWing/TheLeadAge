plugins {
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
}

// 1.21.6: Farmer's Delight Refabricated publishes 1.21.6-3.2.3, so the Lead Knife stays. JEI has no
// 1.21.6 build (its maven skips 1.21.5 -> 1.21.7) and EMI nothing past 1.21.1, so no recipe viewer.
// See the port notes in gradle.properties.
logger.lifecycle("[TheLeadAge] (fabric) 1.21.6 branch: FDR compat; no recipe viewer")

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Architectury API (Fabric).
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive false }

    // Cloth Config — a real (compiled + shipped) Fabric dependency: it backs the
    // Fabric AutoConfig config screen (TheLeadAgeFabricConfig). fabric-api excluded
    // to avoid a transitive downgrade.
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }

    // Farmer's Delight Refabricated, COMPILE-ONLY: LeadKnifeItem extends its KnifeItem, and taking
    // the real artifact here means javac verifies that superclass shape. The alternative, a
    // hand-written stub, type-checks against our own guess and only fails on a player's machine
    // (NoSuchMethodError at item registration, never in a dev run, since FDR is absent here and the
    // isModLoaded guard keeps the path cold). Not shipped and not in the dev runtime: at runtime the
    // class binds to the real FDR jar when the player has it installed.
    modCompileOnly("maven.modrinth:farmers-delight-refabricated:${rootProject.fdr_version}") {
        transitive = false
    }

    // NOTE (1.21.6 branch): no dev-runtime niceties, since AppleSkin has no build past 1.21.3.
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

shadowJar {
    exclude 'architectury.common.json'

    // Belt and braces: nothing under vectorwing/ may ship. LeadKnifeItem binds to the real FDR class
    // (same FQN) at runtime, so any copy of ours in the jar would shadow it. Farmer's Delight is a
    // modCompileOnly dependency, which already keeps it out of the shipped jar; this stays as a guard
    // against a stray class under that package sneaking back in.
    exclude 'vectorwing/**'

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

// Publishing (Fabric jar). ./gradlew :fabric:publishMods (tokens via MODRINTH_TOKEN / CURSEFORGE_TOKEN env vars).
apply plugin: 'me.modmuss50.mod-publish-plugin'

publishMods {
    file = remapJar.archiveFile
    version = rootProject.mod_version
    displayName = "The Lead Age ${rootProject.mod_version}"
    changelog = rootProject.ext.latestChangelog()
    type = STABLE
    modLoaders.add("fabric")
    // -PpublishDryRun => stage to build/ without uploading.
    dryRun = project.hasProperty("publishDryRun")

    modrinth {
        projectId = providers.gradleProperty("modrinth_project_id")
        accessToken = providers.environmentVariable("MODRINTH_TOKEN").orElse(providers.gradleProperty("modrinth_token"))
        // Tag every supported game version on the upload, not just the build target.
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        requires("architectury-api")
        requires("fabric-api")
        requires("cloth-config")
    }
    curseforge {
        projectId = providers.gradleProperty("curseforge_project_id")
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN").orElse(providers.gradleProperty("curseforge_token"))
        rootProject.supported_minecraft_versions.tokenize(' ,').each { minecraftVersions.add(it) }
        // CurseForge requires explicit side flags (Modrinth infers them from the jar).
        client = true
        server = true
        requires("architectury-api")
        requires("fabric-api")
        requires("cloth-config")
    }
}

sourcesJar {
    def commonSources = project(':common').sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = "${rootProject.mod_id}-fabric"
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
